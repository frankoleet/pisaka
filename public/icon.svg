<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4CAEFB"/>
      <stop offset="100%" stop-color="#2683E0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  
  <!-- Лист бумаги -->
  <rect x="24" y="32" width="72" height="64" rx="4" fill="url(#paper)" opacity="0.95"/>
  
  <!-- Линии на листе (имитация рукописного текста) -->
  <line x1="32" y1="44" x2="72" y2="44" stroke="#3196EF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="54" x2="84" y2="54" stroke="#3196EF" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="64" x2="68" y2="64" stroke="#3196EF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="74" x2="80" y2="74" stroke="#3196EF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="84" x2="64" y2="84" stroke="#3196EF" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Ручка -->
  <path d="M72 68 L88 52 L94 58 L78 74 Z" fill="#2683E0"/>
  <circle cx="91" cy="55" r="4" fill="#FFD966"/>
  <path d="M72 68 L76 72 L78 74 L72 68 Z" fill="#1A5A9E" opacity="0.6"/>
</svg>
